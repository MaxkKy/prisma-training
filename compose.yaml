# ชื่อโปรเจกต์ Compose (ใช้เป็น prefix ชื่อ network / volume / container)
name: myproject

services:
  # ---------- แอป Next.js ----------
  web:
    # build image จาก Dockerfile ในโฟลเดอร์ปัจจุบัน
    build: .
    # ชื่อ image หลัง build
    image: max-design-image
    ports:
      # map พอร์ตเครื่องคุณ:พอร์ตใน container
      # เปิด http://localhost:3001 → ไปที่แอปใน container พอร์ต 3000
      - "3001:3000"
    environment:
      # โหมดรันแอป
      NODE_ENV: production
      # ใน Docker network ใช้ชื่อ service เป็น hostname (ไม่ใช่ localhost)
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      # ${...} = ดึงค่าจากไฟล์ .env ของโปรเจกต์ตอน compose
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      # connection string ให้ Prisma / เครื่องมืออื่นใช้ (host เป็น db)
      DATABASE_URL: mysql://${DATABASE_USER}:${DATABASE_PASSWORD}@db:3306/${DATABASE_NAME}
    # ทับ CMD ใน Dockerfile: migrate ตารางก่อน แล้วค่อย start แอป
    command: sh -c "npx prisma migrate deploy && npm run start"
    depends_on:
      db:
        # รอให้ db ผ่าน healthcheck ก่อนค่อย start web
        condition: service_healthy
    # ถ้ารันพังจะพยายาม start ใหม่ (ยกเว้นตอนเรา stop เอง)
    restart: unless-stopped

  # ---------- MySQL ----------
  db:
    image: mysql:8
    ports:
      # เปิดพอร์ต MySQL ออกเครื่อง host (ใช้กับ phpMyAdmin / prisma studio ฯลฯ)
      - "3306:3306"
    # แนบ secret ชื่อ db_password เข้า container นี้
    secrets:
      - db_password
    environment:
      # สร้าง database ว่างตามชื่อจาก .env
      MYSQL_DATABASE: ${DATABASE_NAME}
      # อ่านรหัส root จากไฟล์ secret (ไม่ใส่รหัสตรงๆ ใน YAML)
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      # เก็บข้อมูล MySQL ใน named volume → ลบ container แล้วข้อมูลยังอยู่
      # (จะหายเมื่อ docker compose down -v)
      - db_data:/var/lib/mysql
    healthcheck:
      # เช็กว่า MySQL พร้อมรับ connection หรือยัง
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$(cat /run/secrets/db_password) || exit 1",
        ]
      interval: 5s      # เช็กทุก 5 วินาที
      timeout: 5s       # รอผลแต่ละครั้งไม่เกิน 5 วินาที
      retries: 10       # ล้มเหลวติดกันกี่ครั้งถึงถือว่า unhealthy
      start_period: 20s # ช่วงแรกให้ MySQL มีเวลา init
    restart: unless-stopped

# นิยาม secret: ไฟล์รหัสบนเครื่อง → mount เป็น /run/secrets/db_password ใน container
secrets:
  db_password:
    file: ./secrets/db_password.txt

# นิยาม named volume ให้ Docker จัดการที่เก็บข้อมูล
volumes:
  db_data:
